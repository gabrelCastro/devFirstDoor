server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A adaptação de currículo faz até duas chamadas à IA (90 s cada, no pior caso). Com o
    # padrão de 60 s, o nginx devolveria 504 enquanto o backend ainda termina e grava a versão.
    location /api/curriculo/ {
        proxy_pass http://backend:8080/api/curriculo/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
