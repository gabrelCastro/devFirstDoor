<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vagas de estágio e Java júnior coletadas automaticamente de múltiplas fontes." />
    <meta name="theme-color" content="#eaf1f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1420" media="(prefers-color-scheme: dark)" />
    <title>Dev First Door</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <script>
      (function () {
        try {
          var tema = localStorage.getItem('tema')
          if (tema !== 'claro' && tema !== 'escuro') {
            tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'
          }
          document.documentElement.setAttribute('data-theme', tema)
        } catch (e) {
          // localStorage/matchMedia indisponíveis — mantém o tema padrão do navegador
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
