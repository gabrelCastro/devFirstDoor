services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dev_first_door}
      POSTGRES_USER: ${DB_USER:-dev_first_door}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_first_door}
    volumes:
      - dev_first_door_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dev_first_door} -d ${DB_NAME:-dev_first_door}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # O backend grava datas sem fuso (LocalDateTime); sem isso o container usa UTC e
      # o painel mostra horários 3h adiantados. -Duser.timezone não depende do tzdata da imagem.
      JAVA_TOOL_OPTIONS: -Duser.timezone=${TZ:-America/Sao_Paulo}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dev_first_door}
      DB_USER: ${DB_USER:-dev_first_door}
      DB_PASSWORD: ${DB_PASSWORD:-dev_first_door}
      LINKEDIN_ENABLED: ${LINKEDIN_ENABLED:-false}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CADASTRO_ABERTO: ${CADASTRO_ABERTO:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      IA_LIMITE_DIARIO: ${IA_LIMITE_DIARIO:-10}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  dev_first_door_db_data:
