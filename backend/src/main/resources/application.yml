spring:
  application:
    name: dev-first-door
  datasource:
    url: jdbc:h2:file:./data/dev-first-door;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  # Admin criado/sincronizado no banco ao subir (papel ADMIN). Sem senha, nenhum admin é criado.
  admin:
    usuario: ${ADMIN_USER:admin}
    senha: ${ADMIN_PASSWORD:}
  usuarios:
    # POST /api/conta cria contas com o papel USUARIO. false recusa novos cadastros (403).
    cadastro-aberto: ${CADASTRO_ABERTO:true}
  sessao:
    # Validade do token de login (POST /api/auth/login). O logout revoga antes disso.
    duracao: 30d
  notificacoes:
    telegram:
      ligadas: false
      token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
  crawler:
    # Intervalo entre coletas agendadas (ex: 6h, 30m, PT6H).
    intervalo: 6h
    agendamento:
      enabled: true
    # Vagas que não reaparecem numa coleta bem-sucedida da fonte há mais que isso são removidas.
    dias-para-expirar: 7
    gupy:
      enabled: true
      base-url: https://employability-portal.gupy.io/api/v1/jobs
      page-size: 100
      request-delay-ms: 1000
      max-paginas-por-termo: 5
      termos-busca:
        - estágio tecnologia
        - estágio ti
        - desenvolvedor junior
        - programador junior
        - java
        - analista de sistemas junior
    programathor:
      enabled: true
    remoteok:
      enabled: true
    # Greenhouse e Lever não têm busca entre empresas: liste os identificadores dos
    # boards (boards.greenhouse.io/{empresa}, jobs.lever.co/{empresa}). Vazio = não coleta.
    # Empresas com vagas Java no Brasil e que abrem vagas remotas (verificadas em 2026-09).
    greenhouse:
      enabled: true
      empresas:
        - btgpactual
        - c6bank
        - xpinc
        - quintoandar
        - gympass      # Wellhub
        - ebanx
        - jusbrasil
        - rdstation
    lever:
      enabled: true
      empresas:
        - ciandt
        - swile
    linkedin:
      # Busca pública (sem login). Ignora o robots.txt do LinkedIn; ligue só para uso pessoal.
      enabled: ${LINKEDIN_ENABLED:false}
      request-delay-ms: 3000
      request-jitter-ms: 2000
      termos-busca:
        - estágio java
        - estagiário java
        - desenvolvedor java júnior
        - programador java júnior
        - java júnior
        - java jr

logging:
  level:
    com.devfirstdoor: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  # O console do H2 permite abrir conexões JDBC arbitrárias (execução de código no
  # servidor); no Docker a porta 8080 fica exposta e o banco é o Postgres, então desliga.
  h2:
    console:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:dev_first_door}
    username: ${DB_USER:dev_first_door}
    password: ${DB_PASSWORD:dev_first_door}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
